<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 160 600 760" role="img" aria-labelledby="t d">
  <title id="t">청명스마트홈 15필지 배치 개념도</title>
  <desc id="d">도로공사용 도면을 바탕으로 그린 배치 개념도. 북측 전면 도로에서 단지 진입로가 남서쪽으로 내려와 남동쪽으로 꺾이고, 진입로 양쪽과 꺾인 도로 주변에 주택 13동, 북서쪽 전면 도로변에 주택 2동이 놓인다. 남서쪽 경계를 따라 구거가 흐른다.</desc>
  <style>
    .site{fill:#FBFCFC;stroke:#1E3A34;stroke-width:2;stroke-dasharray:8 5}
    .div line{stroke:#A9C3CF;stroke-width:1.4;stroke-dasharray:5 4}
    .house{fill:#DCEAF2;stroke:#1E3A34;stroke-width:1.6;opacity:0;animation:in .45s ease forwards}
    .num{font:700 15px 'IBM Plex Sans KR',sans-serif;fill:#1E3A34;text-anchor:middle;opacity:0;animation:in .45s ease forwards}
    .lbl{font:500 14px 'IBM Plex Sans KR',sans-serif;fill:#1E3A34}
    .sub{font:400 12px 'IBM Plex Sans KR',sans-serif;fill:#4A6560}
    @keyframes in{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.house,.num{animation:none;opacity:1}}
  </style>
  <rect x="80" y="160" width="600" height="760" fill="#F3F8FA"/>
  <defs><clipPath id="clip"><polygon points="325,282 363,283 440,257 455,270 470,300 565,330 550,363 557,440 547,460 500,560 493,593 500,600 520,707 543,740 560,803 587,840 600,892 520,857 473,817 363,740 227,677 200,660 130,590 140,517 135,440 125,385 107,360 100,330 97,310 107,252 165,250 245,270"/></clipPath>
    <clipPath id="clip-old"><polygon points="325,282 363,283 440,257 455,270 470,300 565,330 550,363 557,440 547,460 500,560 493,593 500,600 520,707 543,740 560,803 587,840 600,892 520,857 473,817 363,740 227,677 200,660 130,590 140,517 200,440 307,303"/></clipPath>
    <clipPath id="clip-annex"><polygon points="140,517 135,440 125,385 107,360 100,330 97,310 107,252 165,250 245,270 325,282 307,303 200,440"/></clipPath></defs>
  <!-- 구거 -->
  <path d="M80 585 L190 662 L330 735 L420 792 L520 862 L610 902" fill="none" stroke="#C7DCC0" stroke-width="34" stroke-linecap="round"/>
  <path d="M80 585 L190 662 L330 735 L420 792 L520 862 L610 902" fill="none" stroke="#9CC27A" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text x="285" y="772" class="sub" transform="rotate(25 285 772)">구거(수로)</text>
  <!-- 전면 도로 -->
  <path d="M80 192 L165 233 L245 256 L330 268 L440 244 L500 262 L630 280 L700 250 L750 205 L790 182" fill="none" stroke="#C9D6DC" stroke-width="28" stroke-linejoin="round"/>
  <path d="M80 192 L165 233 L245 256 L330 268 L440 244 L500 262 L630 280 L700 250 L750 205 L790 182" fill="none" stroke="#FBFCFC" stroke-width="1.5" stroke-dasharray="12 10"/>
  <text x="520" y="232" class="lbl">8m 도시계획도로 완공 예정</text>
  <!-- 단지 -->
  <polygon class="site" points="325,282 363,283 440,257 455,270 470,300 565,330 550,363 557,440 547,460 500,560 493,593 500,600 520,707 543,740 560,803 587,840 600,892 520,857 473,817 363,740 227,677 200,660 130,590 140,517 135,440 125,385 107,360 100,330 97,310 107,252 165,250 245,270"/>
  <g class="div" clip-path="url(#clip-old)">
    <line x1="590" y1="526" x2="230" y2="272"/>
    <line x1="548" y1="585" x2="189" y2="331"/>
    <line x1="506" y1="645" x2="146" y2="391"/>
    <line x1="453" y1="719" x2="94" y2="464"/>
    <line x1="606" y1="503" x2="246" y2="249"/>
