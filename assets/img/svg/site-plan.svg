 635)"><rect class="house" x="-31.0" y="-25.0" width="62" height="50" transform="rotate(35.3)" style="animation-delay:0.72s"/><text class="num" y="5" style="animation-delay:0.72s">10</text></g><g transform="translate(445 629)"><rect class="house" x="-31.0" y="-25.0" width="62" height="50" transform="rotate(35.3)" style="animation-delay:0.80s"/><text class="num" y="5" style="animation-delay:0.80s">11</text></g><g transform="translate(390 709)"><rect class="house" x="-31.0" y="-25.0" width="62" height="50" transform="rotate(35.3)" style="animation-delay:0.88s"/><text class="num" y="5" style="animation-delay:0.88s">12</text></g><g transform="translate(504 786)"><rect class="house" x="-31.0" y="-25.0" width="62" height="50" transform="rotate(35.3)" style="animation-delay:0.96s"/><text class="num" y="5" style="animation-delay:0.96s">13</text></g><g transform="translate(156 354)"><rect class="house" x="-31.0" y="-25.0" width="62" height="50" transform="rotate(35.3)" style="animation-delay:1.04s"/><text class="num" y="5" style="animation-delay:1.04s">14</text></g><g transform="translate(243 315)"><rect class="house" x="-31.0" y="-25.0" width="62" height="50" transform="rotate(35.3)" style="animation-delay:1.12s"/><text class="num" y="5" style="animation-delay:1.12s">15</text></g>
  <text x="575" y="520" class="sub">인접 기허가지</text>
  <!-- 방위 -->
  <g transform="translate(130 860)">
    <circle r="22" fill="none" stroke="#1E3A34" stroke-width="1.2"/>
    <path d="M0 -18 L6 4 L0 0 L-6 4 Z" fill="#1E3A34"/>
    <text x="-5" y="-27" class="sub">N</text>
  </g>
  <text x="200" y="905" class="sub">도로공사용 도면 기반 개념도 · 필지 경계와 건물 배치는 확정 설계와 다를 수 있습니다</text>
</svg>
